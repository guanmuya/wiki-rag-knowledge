<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      P1-9 内容安全策略：渲染进程纵深防御。
      - script-src 'self'：只执行本地打包的脚本，挡住 dangerouslySetInnerHTML
        里被注入的 <script>（Markdown.tsx 仍先用 DOMPurify 净化，两道防线并存）；
      - connect-src 只放行本机回环：桌面版后端 sidecar 是 http://127.0.0.1:<动态端口>，
        开发模式另需 Vite HMR 的 ws://localhost:*；不放行任意外网，避免数据外带；
      - img-src 允许 data:/blob: 与 https: 图片，保证 Markdown 里的图示与外链图片正常显示；
      - style-src 'unsafe-inline'：DOMPurify 允许 style 属性、React 也用内联样式；
      - object-src / frame-src 'none'、base-uri 'none'：堵住插件与 <base> 劫持。
      打包版用 file:// 加载 dist/index.html，'self' 在 Electron 下匹配本地文件源。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <!--
      外观首帧：在样式表与 main.tsx 之前把 data-theme / color-scheme / 底色写到 <html>，
      深色用户不会先看到一帧白底。CSP 是 script-src 'self'（不允许内联），
      所以只能是一个外部小脚本；内容见 public/theme-boot.js。
      引用写绝对路径，构建时会按 vite 的 base: './' 改写成相对路径，
      打包版用 file:// 打开 dist/index.html 也能正确命中。
    -->
    <script src="/theme-boot.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232458d6'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E7%9F%A5%3C/text%3E%3C/svg%3E"
    />
    <title>企业知识库 · 文档整理与智能问答</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
