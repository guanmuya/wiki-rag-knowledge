# electron-builder 配置：企业知识库（桌面版）
#
# 目标：Windows x64，NSIS 安装包 / --dir 免安装目录。
# 后端是 PyInstaller 单文件 exe，通过 extraResources 放到 resources/backend/，
# electron/main.js 里用 process.resourcesPath/backend/wrk-backend.exe 查找。
appId: com.wikiraq.knowledge
productName: 企业知识库
copyright: Copyright © 2026 企业知识库

directories:
  # buildResources 指向 build/：build/icon.ico 存在就自动用作应用/安装包图标，
  # 不存在时 electron-builder 回退到 Electron 默认图标，**不会报错**（已实测）。
  # 想换图标：放一个 256x256 的 .ico 到 frontend/build/icon.ico 即可，无需改本文件。
  buildResources: build
  output: release              # 安装包/解包产物输出到 release/，避免与 vite 的 dist/ 互相污染

# 压缩级别是顶层选项（不是 nsis 的子项）。
# maximum：体积优先（安装包更小，用户下载更快），代价是构建多花几分钟。
# 这是「更新慢」的主要可控项之一：包越小，GitHub 源上的下载时间线性下降。
compression: maximum

# Electron 自带 55 个 locale（解包约 41 MB），桌面版只服务中文用户，
# 只留中文/英文，其余 53 个不打包——直接减小安装包，且不影响界面语言。
electronLanguages:
  - zh-CN
  - en-US

# ---- 打进 asar 的文件 ----
# 只放运行时真正需要的：前端静态资源 + Electron 主进程/preload。
# 源码（src/、scripts/、tsconfig*）一律不进包，减小体积也避免泄露源码。
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.{ts,tsx}'
  - '!**/node_modules/**/{test,tests,__tests__,example,examples,docs,doc}/**'
  - '!**/node_modules/**/*.{md,markdown,map,ts,tsx}'
  # 显式排除构建产物，防止 output 目录被递归打包
  - '!release/**'
  - '!build/**'
  - '!scripts/**'
  - '!src/**'

# ---- 打包后的后端 sidecar ----
# frontend/build/backend/wrk-backend.exe → resources/backend/wrk-backend.exe
extraResources:
  - from: build/backend
    to: backend
    filter:
      - '**/*'
      - '!*.pdb'
  # 自动更新源配置：安装后位于 resources/update-config.json，
  # 主进程 updater.cjs 读取它决定 provider / owner / repo 或 generic url。
  - from: electron/update-config.json
    to: update-config.json

asar: true
asarUnpack:
  - '**/*.node'

# 自动更新源。electron-builder 会据此生成 resources/app-update.yml 与 latest.yml。
# 注意：GitHub 仓库必须公开，私有仓库的 Release 资产需要鉴权，终端用户下载不到；
# 要放自建静态源就把 provider 改成 generic 并填 url。
publish:
  provider: github
  owner: guanmuya
  repo: wiki-rag-knowledge
forceCodeSigning: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # 用 ASCII 文件名：latest.yml 里的下载地址直接引用它，中文名在部分静态源/URL 编码下会 404
  artifactName: wiki-rag-knowledge-${version}-${arch}-setup.${ext}
  executableName: 企业知识库
  # 无签名证书：让 electron-builder 跳过 signtool
  signAndEditExecutable: true
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false                          # 走向导，允许用户改安装目录
  # 安装前自动关闭运行中的应用（先礼后兵），避免弹「无法关闭，请手动关闭后重试」
  include: build/installer.nsh
  perMachine: false                        # 默认装到当前用户，无需管理员（不弹 UAC）
  allowToChangeInstallationDirectory: true # 允许改安装目录
  allowElevation: true                     # 用户主动选 Program Files 时才提权
  createDesktopShortcut: true              # 创建桌面快捷方式
  createStartMenuShortcut: true
  shortcutName: 企业知识库
  # 卸载保留 %APPDATA%\wiki-rag-desktop 里的知识库数据与日志。
  # 这是刻意的产品决策：重装后能直接继续用，不会因为卸载丢库。
  # 用户要彻底清理时自己删该目录（关于页给了路径且可一键打开）。
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # 中文安装界面。两个开关必须配合，否则编译出来仍是英文（已实测两次）：
  # - `installerLanguages` 只有在 `multiLanguageInstaller: true` 时才参与编译；
  #   设成 false 时 LangConfigurator 会强制 langs = ["en_US"]。
  # - `language` 是版本资源（VIProductVersion 等）的 locale id，2052 = 简体中文。
  # 只给一种语言（zh_CN）时 NSIS 不会弹语言选择框，界面直接是中文。
  language: "2052"
  installerLanguages:
    - zh_CN
  multiLanguageInstaller: true
  # 生成 .blockmap，客户端可走差量下载；关掉会让每次更新都下全量 130MB
  differentialPackage: true
  artifactName: wiki-rag-knowledge-${version}-${arch}-setup.${ext}
