name: Windows 安装包临时演练

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: windows-release-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    if: github.head_ref == 'codex/ci-cd-automation'
    name: 构建并实际安装检查（不发布）
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: 检出本次提交
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 准备后端打包依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend/requirements-build.txt -r backend/requirements-release.txt -c backend/constraints.txt
      - name: 核对并读取版本
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "import sys; sys.path.insert(0,'.github/scripts'); from release_publish import preview_version; print(preview_version('.'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: 检查 NSIS 模板路径长度
        working-directory: frontend
        shell: pwsh
        run: |
          $nsisPath = node -p "require('module').createRequire(require.resolve('electron-builder/package.json')).resolve('app-builder-lib/templates/nsis/include/allowOnlyOneInstallerInstance.nsh')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "NSIS template path length: $($nsisPath.Length)"
          if ($nsisPath.Length -ge 260) { throw 'NSIS template path exceeds the Windows build tool limit' }
      - name: 构建安装包和更新文件
        working-directory: frontend
        run: node scripts/build.mjs
      - name: 核对安装包及更新文件
        run: .\.venv\Scripts\python.exe -c "import os,sys; sys.path.insert(0,'.github/scripts'); from release_checks import verify_assets; verify_assets(os.environ['RELEASE_VERSION'], 'frontend/release/updates'); print('Release assets validated')"
      - name: 实际安装并检查应用
        run: node frontend/scripts/smoke-release.mjs
      - name: 保存经过检查的发布文件
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-release-${{ github.run_id }}
          path: frontend/release/updates/
          if-no-files-found: error
          retention-days: 2
