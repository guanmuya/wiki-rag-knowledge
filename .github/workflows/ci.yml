name: CI

# 最小 CI（体检清单 P1-1）：PR / push 到 master 自动跑三项检查，任意一项失败即失败。
#   1. python -m pytest backend/tests -q
#   2. pnpm typecheck
#   3. pnpm build:web
# 后端依赖来自 P1-2 的锁文件（requirements-dev.txt + constraints.txt）；
# 前端依赖来自 frontend/pnpm-lock.yaml（--frozen-lockfile）。
# 与本地命令完全一致，见 README.md §9。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 后端测试 + 前端类型检查与构建
    # 本项目是 Windows 桌面程序，测试基线 583 passed, 1 skipped 在
    # Windows 11 / Python 3.13.11 实测；用 windows-latest 保持同一套环境。
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      # 只做类型检查与 Web 构建，不需要下载浏览器 / Electron 二进制
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: 按锁文件安装后端依赖（含测试分组）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt

      - name: 检查 1/3｜全量后端测试
        shell: pwsh
        run: |
          python -m pytest backend/tests -q | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 保存测试基线原始输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-baseline
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: 安装 pnpm 9（与 pnpm-lock.yaml v9 一致）
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 按 frozen lockfile 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 检查 2/3｜前端类型检查
        working-directory: frontend
        run: pnpm typecheck

      - name: 检查 3/3｜前端 Web 构建
        working-directory: frontend
        run: pnpm build:web
