name: CI

# 最小 CI（体检清单 P1-1 + P1-3 + P1-5）：PR / push 到 master 自动跑五项检查，任意一项失败即失败。
#   1. python -m pytest backend/tests -q
#   2. pnpm check:contract（前后端契约一致性，见 docs/API.md §10）
#   3. pnpm typecheck
#   4. pnpm build:web
#   5. pnpm test（前端 E2E，离线确定性 mock，见 frontend/tests/README.md）
# 后端依赖来自 P1-2 的锁文件（requirements-dev.txt + constraints.txt）；
# 前端依赖来自 frontend/pnpm-lock.yaml（--frozen-lockfile）。
# 与本地命令完全一致，见 README.md §9。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 后端测试 + 前端类型检查、构建与自动化测试
    # 本项目是 Windows 桌面程序，测试基线 638 passed, 1 skipped 在
    # Windows Server 2022 / Python 3.13.17（setup-python 解析到的 3.13 最新补丁版）实测；
    # 用 windows-latest 保持与本地一致的运行环境。基线数字的事实源是 docs/FACTS.md §2。
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      # 打包用的 Electron 二进制不需要下载；前端 E2E 需要的 Chromium 由下面
      # 「安装 Playwright Chromium」步骤单独安装（pnpm install 那步显式跳过）。
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: 按锁文件安装后端依赖（含测试分组）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt

      - name: 检查 1/5｜全量后端测试
        shell: pwsh
        run: |
          python -m pytest backend/tests -q | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 保存测试基线原始输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-baseline
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: 安装 pnpm 9（与 pnpm-lock.yaml v9 一致）
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 按 frozen lockfile 安装前端依赖
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # 纯静态比对，不需要 Python 与浏览器：读 backend/app/schemas.py 的 Pydantic 模型、
      # backend/app/routers/*.py 的路由装饰器、frontend/electron/preload.cjs 的暴露面，
      # 与 frontend/src/types.ts、docs/API.md 对齐。校验项见 docs/API.md §10。
      - name: 检查 2/5｜前后端契约一致性
        working-directory: frontend
        run: pnpm check:contract

      - name: 检查 3/5｜前端类型检查
        working-directory: frontend
        run: pnpm typecheck

      - name: 检查 4/5｜前端 Web 构建
        working-directory: frontend
        run: pnpm build:web

      - name: 安装 Playwright Chromium（供前端 E2E 使用）
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: 检查 5/5｜前端自动化测试
        working-directory: frontend
        run: pnpm test
